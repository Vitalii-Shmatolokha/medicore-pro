services:
  - type: web
    name: medicore-pro
    env: docker
    plan: free
    region: frankfurt # or oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: medicore-db
          property: connectionString
      - key: WEB_CONCURRENCY
        value: 1

databases:
  - name: medicore-db
    plan: free
    region: frankfurt
