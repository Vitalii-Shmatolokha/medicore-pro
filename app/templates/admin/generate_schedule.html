{% extends "base.html" %}
{% block title %}Generate Schedule for Dr. {{ doctor.name }}{% endblock %}
{% block content %}
<div class="container">
    <h1>Generate Schedule for Dr. {{ doctor.name }}</h1>
    
    <form method="POST" action="{{ url_for('generate_schedule', doctor_id=doctor.id) }}">
        <div class="form-group">
            <label for="start_date">Start Date</label>
            <input type="date" class="form-control" id="start_date" name="start_date" value="{{ today }}" required>
        </div>
        <div class="form-group">
            <label for="days">Number of Days (1-90)</label>
            <input type="number" class="form-control" id="days" name="days" min="1" max="90" value="7" required>
        </div>
        <div class="form-group">
            <label for="start_hour">Start Hour (0-23)</label>
            <input type="number" class="form-control" id="start_hour" name="start_hour" min="0" max="23" value="9" required>
        </div>
        <div class="form-group">
            <label for="end_hour">End Hour (1-24)</label>
            <input type="number" class="form-control" id="end_hour" name="end_hour" min="1" max="24" value="17" required>
        </div>
        <div class="form-group">
            <label for="slot_duration">Slot Duration (minutes)</label>
            <select class="form-control" id="slot_duration" name="slot_duration" required>
                <option value="15">15 minutes</option>
                <option value="30" selected>30 minutes</option>
                <option value="60">60 minutes</option>
            </select>
        </div>
        <div class="form-group">
            <label>
                <input type="checkbox" name="delete_existing"> Delete existing slots in this period
            </label>
        </div>
        <button type="submit" class="btn btn-primary">Generate Schedule</button>
    </form>
    
    <a href="{{ url_for('schedule_doctor', doctor_id=doctor.id) }}" class="btn btn-secondary mt-3">Back to Schedule</a>
</div>
{% endblock %}
